[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nslkdd"
version = "0.1.0"
description = "Utilitários do trabalho de detecção de intrusão NSL-KDD (IA - PUC Minas)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
